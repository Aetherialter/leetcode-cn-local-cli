[project]
name = "aether-lc"
version = "0.7.0"
description = "Local coding workflow CLI for LeetCode CN."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["cli", "leetcode", "leetcode-cn", "uv"]
authors = [
    { name = "Aetherialter", email = "Aetherialter@outlook.com" }
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "browser-cookie3>=0.20.1",
    "httpx>=0.28.1",
    "rich>=15.0.0",
    "typer>=0.25.1",
]

[project.scripts]
lc = "aether_lc.cli:app"

[project.urls]
Homepage = "https://github.com/Aetherialter/leetcode-cn-local-cli"
Issues = "https://github.com/Aetherialter/leetcode-cn-local-cli/issues"
Repository = "https://github.com/Aetherialter/leetcode-cn-local-cli"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
